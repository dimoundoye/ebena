    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="ÉBËNA, le grand rendez-vous de la création africaine en Europe : 4, 5 et 6 juin 2027 au Parc des Chantiers, Nantes. Six pavillons, la Scène ÉBËNA, le Bénin pays invité d’honneur."
    />
    <meta name="theme-color" content="#FDF5E8" />

    <meta property="og:image" content="/images/og-ebena.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ouverture du site (components/Intro.jsx) : une fois par visite, en arrivant sur l'accueil.
         Décidée ici pour que l'écran soit ébène dès le départ, sans éclair clair avant React. -->
    <script>
      try {
        if (location.pathname === '/' && !sessionStorage.getItem('ebena-intro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.dataset.intro = 'play';
        }
      } catch (error) {}
    </script>
    <style>
      html[data-intro] #root:empty {
        position: fixed;
        inset: 0;
        background: #1e0a06;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
