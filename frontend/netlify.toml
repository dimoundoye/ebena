# Déploiement du site sur Netlify (dossier de base : frontend).
# Ces réglages sont prioritaires sur ceux de l'interface Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- API ---------------------------------------------------------------------
# Netlify n'héberge que le site : l'API (Express + PostgreSQL) doit tourner ailleurs
# (VPS, Render, Railway…). Une fois l'API en ligne, remplacer la règle suivante par
# ce relais, en adaptant l'adresse :
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.votre-domaine.fr/api/:splat"
#   status = 200
#   force = true
#
# En attendant, les appels /api reçoivent un message « service indisponible »
# au lieu de la page du site (sinon les formulaires croiraient à un envoi réussi).
[[redirects]]
  from = "/api/*"
  to = "/api-indisponible.json"
  status = 404
  force = true

# --- Application monopage ----------------------------------------------------
# Toutes les autres routes (/programme, /exposants, /admin…) renvoient index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
